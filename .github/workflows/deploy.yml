name: Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Checks and builds every change. master deploys dist/ to the vmihalachi-com Worker (wrangler.json),
  # served on vmihalachi.com; a pull request from this repository uploads a preview version instead.
  build_and_deploy:
    runs-on: ubuntu-latest
    name: ${{ github.event_name == 'pull_request' && 'Check and preview' || 'Check and deploy' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy
      # Uploads a version that serves no production traffic, at pr-<number>-vmihalachi-com.<subdomain>.workers.dev.
      - name: Upload preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes wrangler@4.147.0 versions upload --preview-alias "pr-$PR_NUMBER" | tee upload.log
          grep -o 'https://[^ ]*workers\.dev' upload.log | sed 's/^/Preview: /' >> "$GITHUB_STEP_SUMMARY" || true
